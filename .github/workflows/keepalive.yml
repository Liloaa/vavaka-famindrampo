name: Keep alive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'API
        run: curl --fail --silent --show-error --retry 5 --retry-delay 30 --retry-all-errors --max-time 120 "${{ secrets.API_URL }}/api/sante"